# CI/CD Stage Deployment Pipeline Configuration
# This pipeline runs comprehensive quality checks and deploys to staging environment
# Triggers on pushes to stage/staging branches with full CI/CD validation

name: CI/CD Stage Deploy Pipeline

on:
  push:
    branches:
      - stage

jobs:
  code-quality:
    name: Code Quality
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ['20']
        os: [ubuntu-latest]
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint Code (ESLint)
        run: npm run lint:check

      - name: Format Code (Prettier)
        run: npm run format:check

      - name: Tests (Unit Tests)
        run: npm run test:ci

      - name: Security Audit (Advisory)
        run: npm run security:audit || true
        continue-on-error: true

  deploy:
    name: Deploy to Stage
    runs-on: ${{ matrix.os }}
    environment: stage
    strategy:
      max-parallel: 1
      matrix:
        node-version: ['20']
        os: [ubuntu-latest]
    timeout-minutes: 20
    needs: [code-quality]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Setup AIO CLI
        uses: adobe/aio-cli-setup-action@1.3.0
        with:
          os: ${{ matrix.os }}
          version: 10.x.x

      - name: Validate Authorization (AIO CLI)
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ${{ matrix.os }}
          command: oauth_sts
          CLIENTID: ${{ secrets.CLIENTID }}
          CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
          TECHNICALACCOUNTID: ${{ secrets.TECHNICALACCID }}
          TECHNICALACCOUNTEMAIL: ${{ secrets.TECHNICALACCEMAIL }}
          IMSORGID: ${{ secrets.IMSORGID }}
          SCOPES: ${{ secrets.SCOPES }}

      - name: Build Application (AIO CLI)
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
          IMS_OAUTH_S2S_CLIENT_ID: ${{ secrets.CLIENTID }}
          IMS_OAUTH_S2S_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
          IMS_OAUTH_S2S_ORG_ID: ${{ secrets.IMSORGID }}
          IMS_OAUTH_S2S_SCOPES: ${{ secrets.SCOPES }}
          COMMERCE_BASE_URL: ${{ vars.COMMERCE_BASE_URL }}
          COMMERCE_CONSUMER_KEY: ${{ secrets.COMMERCE_CONSUMER_KEY }}
          COMMERCE_CONSUMER_SECRET: ${{ secrets.COMMERCE_CONSUMER_SECRET }}
          COMMERCE_ACCESS_TOKEN: ${{ secrets.COMMERCE_ACCESS_TOKEN }}
          COMMERCE_ACCESS_TOKEN_SECRET: ${{ secrets.COMMERCE_ACCESS_TOKEN_SECRET }}
          PRICE_CHANGE_INTERNAL_EVENTS_PROVIDER_ID: ${{ vars.PRICE_CHANGE_INTERNAL_EVENTS_PROVIDER_ID }}
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ${{ matrix.os }}
          command: build

      - name: Deploy Application (AIO CLI)
        env:
          AIO_RUNTIME_NAMESPACE: ${{ secrets.AIO_RUNTIME_NAMESPACE }}
          AIO_RUNTIME_AUTH: ${{ secrets.AIO_RUNTIME_AUTH }}
          AIO_PROJECT_ID: ${{ secrets.AIO_PROJECT_ID }}
          AIO_PROJECT_NAME: ${{ secrets.AIO_PROJECT_NAME }}
          AIO_PROJECT_ORG_ID: ${{ secrets.AIO_PROJECT_ORG_ID }}
          AIO_PROJECT_WORKSPACE_ID: ${{ secrets.AIO_PROJECT_WORKSPACE_ID }}
          AIO_PROJECT_WORKSPACE_NAME: ${{ secrets.AIO_PROJECT_WORKSPACE_NAME }}
          AIO_PROJECT_WORKSPACE_DETAILS_SERVICES: ${{ secrets.AIO_PROJECT_WORKSPACE_DETAILS_SERVICES }}
          IMS_OAUTH_S2S_CLIENT_ID: ${{ secrets.CLIENTID }}
          IMS_OAUTH_S2S_CLIENT_SECRET: ${{ secrets.CLIENTSECRET }}
          IMS_OAUTH_S2S_ORG_ID: ${{ secrets.IMSORGID }}
          IMS_OAUTH_S2S_SCOPES: ${{ secrets.SCOPES }}
          COMMERCE_BASE_URL: ${{ vars.COMMERCE_BASE_URL }}
          COMMERCE_CONSUMER_KEY: ${{ secrets.COMMERCE_CONSUMER_KEY }}
          COMMERCE_CONSUMER_SECRET: ${{ secrets.COMMERCE_CONSUMER_SECRET }}
          COMMERCE_ACCESS_TOKEN: ${{ secrets.COMMERCE_ACCESS_TOKEN }}
          COMMERCE_ACCESS_TOKEN_SECRET: ${{ secrets.COMMERCE_ACCESS_TOKEN_SECRET }}
          PRICE_CHANGE_INTERNAL_EVENTS_PROVIDER_ID: ${{ vars.PRICE_CHANGE_INTERNAL_EVENTS_PROVIDER_ID }}
        uses: adobe/aio-apps-action@4.1.0
        with:
          os: ${{ matrix.os }}
          command: deploy
          noPublish: true
