generic:
  function: ../../../../build/actions/example/generic/index.js
  web: 'yes'
  runtime: nodejs:22
  limits:
    memory: 512
  inputs:
    LOG_LEVEL: debug
  annotations:
    include-ims-credentials: true
    require-adobe-auth: false
    final: true
telemetry:
  function: ../../../../build/actions/example/telemetry/index.js
  web: 'yes'
  runtime: nodejs:22
  limits:
    memory: 512
  inputs:
    LOG_LEVEL: debug
    ENABLE_TELEMETRY: true
    GRAFANA_TELEMETRY: true
    GRAFANA_DEV: true
  annotations:
    require-adobe-auth: false
    final: true
