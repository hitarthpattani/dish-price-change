operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
hooks:
  pre-app-build: hooks/pre-app-build.js
  pre-app-deploy: hooks/pre-app-deploy.js
runtimeManifest:
  packages:
    admin-ui-sdk:
      license: Apache-2.0
      actions:
        $include: actions/admin-ui-sdk/actions.config.yaml
    application-crons:
      license: Apache-2.0
      actions:
        $include: actions/application-crons/actions.config.yaml
      triggers:
        $include: actions/application-crons/triggers.config.yaml
      rules:
        $include: actions/application-crons/rules.config.yaml
    cache-manager:
      license: Apache-2.0
      actions:
        $include: actions/cache-manager/actions.config.yaml
    configuration:
      license: Apache-2.0
      actions:
        $include: actions/configuration/actions.config.yaml
    external-events:
      license: Apache-2.0
      actions:
        $include: actions/external-events/actions.config.yaml
    price-change:
      license: Apache-2.0
      actions:
        $include: actions/price-change/actions.config.yaml
    renewal-notification:
      license: Apache-2.0
      actions:
        $include: actions/renewal-notification/actions.config.yaml
      apis:
        $include: actions/renewal-notification/apis.config.yaml
